[package]
name = "WinGlance"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# Direct dependency so the `windows::core::implement!` macro's generated code
# (which references `::windows_core`) resolves. `windows` already pulls in this
# exact crate transitively; promoting it to a direct dependency only makes the
# codegen support crate nameable. No new behavioral dependency.
windows-core = "0.62"
# Direct dependency so the `windows_future` async bindings (IAsyncOperation and
# friends, which the refreshed metadata moved out of `windows::Foundation`)
# are nameable from src/smtc.rs. `windows` pulls in this exact crate
# transitively; the direct dependency only makes the codegen support crate
# nameable.
windows-future = "0.3"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_WinRT",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[build-dependencies]
# Embeds the Common-Controls v6 manifest so comctl32 runs its modern,
# widely-exercised tooltip implementation instead of legacy 5.82 (whose
# per-window tool tracking silently dropped every history-row tooltip).
# Build-time only; the binary carries one XML resource.
embed-manifest = "1.5"

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
strip = "symbols"
