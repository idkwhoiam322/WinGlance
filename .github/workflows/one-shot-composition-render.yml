name: One-shot composition render tuning

on:
  push:
    branches: [blur-effect]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, 'run composition render tuning') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply guarded render tuning
        run: python scripts/one_shot_composition_render.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit tuning
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/overlay/render.rs src/overlay/backdrop.rs
          if (git diff --cached --quiet) {
            Write-Host "No changes to commit"
            exit 0
          }
          git commit -m "feat(overlay): tune luminous composition glass"
          git push origin HEAD:blur-effect
