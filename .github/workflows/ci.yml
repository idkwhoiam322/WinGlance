name: CI

on:
  push:
    branches: [main, checkpoint]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to create after a successful build ('none' = plain CI run, 'auto' = next patch, or type a tag like v0.2.0)"
        required: false
        default: "none"

permissions:
  contents: read

jobs:
  audit-apply:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/checkpoint' && startsWith(github.event.head_commit.message, 'audit-patch:') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply reviewed audit delta
        shell: pwsh
        run: |
          $p = 'docs/architecture.md'
          $text = Get-Content -Raw -LiteralPath $p
          if ($text -notmatch '(?m)^## Overlay\r?$') {
            if ($text -notmatch '(?m)^## Threading model\r?$') { throw 'architecture insertion anchor missing' }
            $text = [regex]::Replace($text, '(?m)^## Threading model\r?$', "## Overlay`r`n`r`n## Threading model", 1)
            Set-Content -LiteralPath $p -Value $text -NoNewline -Encoding utf8
          }
          $scriptPath = '.github/scripts/audit_apply.py'
          $script = Get-Content -Raw -LiteralPath $scriptPath
          $script = $script.Replace('"/// Read-only name provider for the passive overlay pill window.\n",', '"#[implement(IRawElementProviderSimple)]\nstruct PillNameProvider {\n",')
          $script = $script.Replace(
            '    EnumDisplayMonitors, GetMonitorInfoW, HDC, HMONITOR, MONITORINFO, MONITORINFOEXW, MONITORINFOF_PRIMARY,',
            "    DEVMODEW, ENUM_CURRENT_SETTINGS, EnumDisplayMonitors, EnumDisplaySettingsW, GetMonitorInfoW, HDC, HMONITOR,`n    MONITOR_DEFAULTTONEAREST, MONITORINFO, MONITORINFOEXW, MonitorFromWindow,"
          )
          $script = $script.Replace(
            "    DISPLAY_DEVICEW, EnumDisplayDevicesW, EnumDisplayMonitors, GetMonitorInfoW, HDC, HMONITOR, MONITORINFO,`n    MONITORINFOEXW, MONITORINFOF_PRIMARY,",
            "    DISPLAY_DEVICEW, DEVMODEW, ENUM_CURRENT_SETTINGS, EnumDisplayDevicesW, EnumDisplayMonitors, EnumDisplaySettingsW,`n    GetMonitorInfoW, HDC, HMONITOR, MONITOR_DEFAULTTONEAREST, MONITORINFO, MONITORINFOEXW, MonitorFromWindow,"
          )
          Set-Content -LiteralPath $scriptPath -Value $script -NoNewline -Encoding utf8
          python .github/scripts/audit_apply.py

  check:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/checkpoint' && startsWith(github.event.head_commit.message, 'audit-patch:')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Build (release)
        run: cargo build --release --locked
      - name: Upload release exe
        uses: actions/upload-artifact@v7
        with:
          name: WinGlance-windows
          path: target/release/WinGlance.exe
          if-no-files-found: error
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo-audit (advisories)
        run: cargo audit
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo-deny (licenses, bans, advisories, sources)
        run: cargo deny check

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release != 'none' }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute release tag
        id: compute
        shell: pwsh
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          $release = $env:RELEASE_INPUT
          if ($release -eq "auto") {
            git fetch --tags --force
            $latest = git tag --sort=-v:refname |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              Select-Object -First 1
            if ($latest) {
              $m = [regex]::Match($latest, '^v(\d+)\.(\d+)\.(\d+)$')
              $tag = "v$($m.Groups[1].Value).$($m.Groups[2].Value).$([int]$m.Groups[3].Value + 1)"
            } else {
              $tag = "v1.0.0"
            }
          } elseif ($release -match '^v\d+\.\d+\.\d+$') {
            $tag = $release
          } else {
            Write-Error "invalid release input '$release': expected 'auto' or a vN.N.N tag"
            exit 1
          }
          Write-Host "Release tag: $tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
      - name: Download CI artifact
        uses: actions/download-artifact@v8
        with:
          name: WinGlance-windows
          path: staging
      - name: Stage release assets
        id: stage
        shell: pwsh
        run: |
          $fullSha = "${{ github.sha }}"
          $shortSha = $fullSha.Substring(0, [Math]::Min(7, $fullSha.Length))
          $stamp = [DateTime]::UtcNow.ToString("yyyyMMdd-HHmmss")
          $assetName = "WinGlance-$stamp-$shortSha.exe"
          Copy-Item staging/WinGlance.exe "staging/$assetName"
          $hash = Get-FileHash -Algorithm SHA256 "staging/$assetName"
          Set-Content -Path "staging/$assetName.sha256" -Value ($hash.Hash.ToLowerInvariant() + "  " + $assetName) -Encoding ascii
          Add-Content -Path $env:GITHUB_OUTPUT -Value "asset=$assetName"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.compute.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            staging/${{ steps.stage.outputs.asset }}
            staging/${{ steps.stage.outputs.asset }}.sha256
            config.example.toml
          generate_release_notes: true
