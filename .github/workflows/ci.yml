name: CI

on:
  push:
    branches: [main, checkpoint]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to create after a successful build ('none' = plain CI run, 'auto' = next patch, or type a tag like v0.2.0)"
        required: false
        default: "none"

# Check jobs run untrusted pull-request code and must not carry write
# credentials; tag creation is isolated in its own write-permission job below.
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Build (release)
        run: cargo build --release --locked
      - name: Upload release exe
        uses: actions/upload-artifact@v7
        with:
          name: WinGlance-windows
          path: target/release/WinGlance.exe
          if-no-files-found: error
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo-audit (advisories)
        run: cargo audit
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo-deny (licenses, bans, advisories, sources)
        run: cargo deny check

  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned static-analysis tools
        run: |
          cargo install rust-code-analysis-cli --version 0.0.25 --locked
          cargo install cargo-machete --version 0.9.2 --locked
      - name: Complexity and Halstead thresholds
        env:
          # Clean seven-commit behavioral-remediation boundary. Existing debt
          # at this boundary is grandfathered; new or worsened debt fails CI.
          QUALITY_BASE_SHA: da06088ddbe62b0ea6620398221f6298d3b84603
        run: |
          mkdir -p target/quality-metrics target/quality-baseline target/quality-baseline-metrics
          rust-code-analysis-cli -m -p src -O json -o target/quality-metrics
          git archive "$QUALITY_BASE_SHA" src | tar -x -C target/quality-baseline
          rust-code-analysis-cli -m -p target/quality-baseline/src -O json -o target/quality-baseline-metrics
          python scripts/check_quality_metrics.py target/quality-metrics target/quality-baseline-metrics
      - name: Unused dependency check
        run: cargo machete

  mutation:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release != 'none') || (github.event_name == 'push' && github.ref == 'refs/heads/checkpoint' && contains(github.event.head_commit.message, '[mutation]')) }}
    needs: check
    runs-on: windows-latest
    env:
      MUTATION_CORE_RE: '(enforce_startup_policy|TrackInfo::same_media|OverlayState::(idle_status_title|idle_event|content_playing)|hover_(capped|restored)_deadline|resolve_target_persisted|refresh_identity_slot)'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned mutation runner
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Prove deterministic-core mutation scope
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          cargo mutants --no-config --list --json `
            --file src/main.rs `
            --file src/events.rs `
            --file src/overlay/mod.rs `
            --file src/overlay/fullscreen.rs `
            --examine-re $env:MUTATION_CORE_RE `
            | Set-Content -Encoding utf8 target/mutation-core-list.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_mutation_core.py list `
            target/mutation-core-list.json `
            target/mutation-core-selected.txt
      - name: Require zero surviving deterministic-core mutants
        shell: pwsh
        run: |
          cargo mutants --no-config --no-shuffle --baseline=skip --timeout-multiplier 3 `
            --file src/main.rs `
            --file src/events.rs `
            --file src/overlay/mod.rs `
            --file src/overlay/fullscreen.rs `
            --examine-re $env:MUTATION_CORE_RE
          $engineExit = $LASTEXITCODE
          Write-Host "cargo-mutants engine exit: $engineExit"
          $outcomes = 'mutants.out/outcomes.json'
          if (-not (Test-Path -LiteralPath $outcomes)) {
            Write-Error "cargo-mutants did not produce $outcomes"
            exit 1
          }
          python scripts/check_mutation_core.py outcomes `
            target/mutation-core-list.json `
            $outcomes
          $verdictExit = $LASTEXITCODE
          if ($verdictExit -ne 0) { exit $verdictExit }
          if ($engineExit -ne 0) {
            Write-Warning "cargo-mutants reported failures outside the metadata-selected deterministic core; see uploaded diagnostics"
          }
      - name: Upload mutation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-core
          path: |
            target/mutation-core-list.json
            target/mutation-core-selected.txt
            mutants.out
          if-no-files-found: warn

  # Isolated from check jobs: only repository-owner workflow_dispatch runs may
  # publish a release, and PR code never receives a write token.
  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release != 'none' }}
    needs: [check, metrics, mutation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute release tag
        id: compute
        shell: pwsh
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          $release = $env:RELEASE_INPUT
          if ($release -eq "auto") {
            git fetch --tags --force
            $latest = git tag --sort=-v:refname |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              Select-Object -First 1
            if ($latest) {
              $m = [regex]::Match($latest, '^v(\d+)\.(\d+)\.(\d+)$')
              $tag = "v$($m.Groups[1].Value).$($m.Groups[2].Value).$([int]$m.Groups[3].Value + 1)"
            } else {
              $tag = "v1.0.0"
            }
          } elseif ($release -match '^v\d+\.\d+\.\d+$') {
            $tag = $release
          } else {
            Write-Error "invalid release input '$release': expected 'auto' or a vN.N.N tag"
            exit 1
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
      - name: Download CI artifact
        uses: actions/download-artifact@v8
        with:
          name: WinGlance-windows
          path: staging
      - name: Stage release assets
        id: stage
        shell: pwsh
        run: |
          $fullSha = "${{ github.sha }}"
          $shortSha = $fullSha.Substring(0, [Math]::Min(7, $fullSha.Length))
          $stamp = [DateTime]::UtcNow.ToString("yyyyMMdd-HHmmss")
          $assetName = "WinGlance-$stamp-$shortSha.exe"
          Copy-Item staging/WinGlance.exe "staging/$assetName"
          $hash = Get-FileHash -Algorithm SHA256 "staging/$assetName"
          Set-Content -Path "staging/$assetName.sha256" -Value ($hash.Hash.ToLowerInvariant() + "  " + $assetName) -Encoding ascii
          Add-Content -Path $env:GITHUB_OUTPUT -Value "asset=$assetName"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.compute.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            staging/${{ steps.stage.outputs.asset }}
            staging/${{ steps.stage.outputs.asset }}.sha256
            config.example.toml
          generate_release_notes: true
