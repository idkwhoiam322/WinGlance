name: One-shot blur effect implementation

on:
  push:
    branches: [blur-effect]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, 'run blur effect implementation') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply guarded source patches
        run: python scripts/one_shot_blur_effect.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config.rs src/overlay/mod.rs src/overlay/render.rs src/main_window.rs config.example.toml
          if (git diff --cached --quiet) {
            Write-Host "No changes to commit"
            exit 0
          }
          git commit -m "feat(overlay): add opt-in Windows 11 glass material"
          git push origin HEAD:blur-effect
