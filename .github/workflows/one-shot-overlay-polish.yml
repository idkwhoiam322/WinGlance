          '''    if let Some(art) = decoded_art {
      draw_art_scaled(pixels, width, art, art_x, art_y, art_size, accent, content_alpha);
  } else {
      draw_placeholder(pixels, width, art_x, art_y, art_size, dim_color(accent, content_alpha));
  }''',
