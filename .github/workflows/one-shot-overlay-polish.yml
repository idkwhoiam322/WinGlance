name: One-shot overlay polish

on:
  push:
    branches:
      - checkpoint

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: run overlay polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: checkpoint
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Reconcile remaining docs
        run: |
          python scripts/one_shot_overlay_polish.py docs
          cargo fmt --all
          git add docs/architecture.md src/config.rs
          git commit -m "docs: finish contract reconciliation"
      - name: Improve no-art source presentation
        run: |
          python scripts/one_shot_overlay_polish.py no-art
          cargo fmt --all
          git add src/overlay/render.rs
          git commit -m "feat(overlay): improve no-art source presentation"
      - name: Refine content crossfade
        run: |
          python scripts/one_shot_overlay_polish.py crossfade
          cargo fmt --all
          git add src/overlay/render.rs
          git commit -m "feat(overlay): refine content crossfade"
      - name: Remove one-shot helpers and push
        run: |
          git rm .github/workflows/one-shot-overlay-polish.yml scripts/one_shot_overlay_polish.py
          git commit -m "chore: remove one-shot patch helpers"
          git push origin HEAD:checkpoint
