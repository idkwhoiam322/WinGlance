              pixels,
              width,
              state.palette,
              state.config.appearance.accent_color,
              art_x,
              art_y,
              art_size,
              art_radius,
              state.decoded_art.as_deref(),
              source_icon,
              fallback_playback,
              fallback_type,
              scale,
              content_alpha,
          );''')

