name: One-shot no-art quality fix

on:
  push:
    branches:
      - checkpoint

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'run no-art quality fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: checkpoint
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply quality-preserving extraction
        run: |
          python scripts/one_shot_quality_fix.py
          cargo fmt --all
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/overlay/render.rs
          git commit -m "refactor(overlay): isolate no-art source decision"
          git push origin HEAD:checkpoint
