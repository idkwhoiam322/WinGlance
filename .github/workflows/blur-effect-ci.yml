name: Blur effect CI

on:
  push:
    branches: [blur-effect]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked

  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned static-analysis tools
        run: |
          cargo install rust-code-analysis-cli --version 0.0.25 --locked
          cargo install cargo-machete --version 0.9.2 --locked
      - name: Complexity and Halstead thresholds
        env:
          QUALITY_BASE_SHA: da06088ddbe62b0ea6620398221f6298d3b84603
        run: |
          mkdir -p target/quality-metrics target/quality-baseline target/quality-baseline-metrics
          rust-code-analysis-cli -m -p src -O json -o target/quality-metrics
          git archive "$QUALITY_BASE_SHA" src | tar -x -C target/quality-baseline
          rust-code-analysis-cli -m -p target/quality-baseline/src -O json -o target/quality-baseline-metrics
          python scripts/check_quality_metrics.py target/quality-metrics target/quality-baseline-metrics
      - name: Unused dependency check
        run: cargo machete
