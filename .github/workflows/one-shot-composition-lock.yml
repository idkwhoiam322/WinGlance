name: One-shot composition lockfile update

on:
  push:
    branches: [blur-effect]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, 'run composition lock update') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh lockfile resolution
        run: cargo metadata --format-version 1 | Out-Null
      - name: Commit lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if (git diff --cached --quiet) {
            throw 'Cargo.lock did not change'
          }
          git commit -m "build: refresh lockfile for composition glass"
          git push origin HEAD:blur-effect
