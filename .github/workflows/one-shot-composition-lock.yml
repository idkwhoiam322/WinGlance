name: One-shot composition lockfile update

on:
  push:
    branches: [blur-effect]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, 'run composition lock update') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Update root lock dependency
        shell: pwsh
        run: |
          $path = 'Cargo.lock'
          $text = Get-Content -Raw $path
          $old = " `"windows-future`",`n]"
          $new = " `"windows-future`",`n `"windows-numerics`",`n]"
          if (-not $text.Contains($old)) { throw 'Cargo.lock root dependency anchor not found' }
          $text = $text.Replace($old, $new)
          Set-Content -NoNewline -Encoding utf8 $path $text
      - name: Commit lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh lockfile for composition glass"
          git push origin HEAD:blur-effect
