name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: WinGlance-windows
          path: staging
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage release assets
        shell: pwsh
        run: |
          $fullSha = "${{ github.event.workflow_run.head_sha }}"
          $shortSha = $fullSha.Substring(0, [Math]::Min(7, $fullSha.Length))
          $stamp = [DateTime]::UtcNow.ToString("yyyyMMdd-HHmmss")
          $assetName = "WinGlance-$stamp-$shortSha.exe"
          Copy-Item staging\WinGlance.exe "staging\$assetName"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_ASSET=$assetName"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: |
            staging/${{ env.RELEASE_ASSET }}
            config.example.toml
          generate_release_notes: true
