name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    # Only publish for tag-push CI runs: the executable and example config
    # must come from a commit the repository owner tagged, not from a pull
    # request or a manual dispatch build.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: windows-latest
    steps:
      # Check out the exact commit the CI run built, so the published
      # config.example.toml matches the tagged binary even when the default
      # branch advanced past it.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Find release tag at the CI commit
        id: find
        shell: pwsh
        run: |
          git fetch --tags --force
          $tag = git tag --points-at "${{ github.event.workflow_run.head_sha }}" |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            Select-Object -First 1
          if ($tag) {
            Write-Host "Release tag found: $tag"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          } else {
            Write-Host "No vN.N.N tag at the CI commit; nothing to publish"
          }
      - name: Download CI artifact
        if: steps.find.outputs.tag != ''
        uses: actions/download-artifact@v4
        with:
          name: WinGlance-windows
          path: staging
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage release assets
        if: steps.find.outputs.tag != ''
        shell: pwsh
        run: |
          $fullSha = "${{ github.event.workflow_run.head_sha }}"
          $shortSha = $fullSha.Substring(0, [Math]::Min(7, $fullSha.Length))
          $stamp = [DateTime]::UtcNow.ToString("yyyyMMdd-HHmmss")
          $assetName = "WinGlance-$stamp-$shortSha.exe"
          Copy-Item staging\WinGlance.exe "staging\$assetName"
          $hash = Get-FileHash -Algorithm SHA256 "staging\$assetName"
          Set-Content -Path "staging\$assetName.sha256" -Value ($hash.Hash.ToLowerInvariant() + "  " + $assetName) -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_ASSET=$assetName"
      - name: Publish GitHub Release
        if: steps.find.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.find.outputs.tag }}
          files: |
            staging/${{ env.RELEASE_ASSET }}
            staging/${{ env.RELEASE_ASSET }}.sha256
            config.example.toml
          generate_release_notes: true
