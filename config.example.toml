[overlay]
duration_ms = 5000
# While true, the pill stays up at least as long as Windows' "show
# notifications for" preference (Settings > Accessibility > Notifications);
# false makes duration_ms the exact, explicit duration.
respect_system_message_duration = true
animation_ms = 500
# Vertical edge: "top" | "bottom".
vertical = "top"
# Horizontal placement: "left" | "center" | "right".
horizontal = "center"
# Logical-pixel margin from the chosen edge (after DPI scaling).
margin = 8
max_width = 340
# Animation tick-rate cap in Hz; config.toml only (no Settings UI entry).
# Values at or below 60 keep the default 60 Hz cap, values above 1000 clamp
# to 1000.
# max_tick_hz = 60
# Optional absolute overrides (96-DPI logical pixels). When set, the pill is
# placed here instead of the anchor above; set by the "Adjust position" drag.
# position_x = 0
# position_y = 0
# Which display the pill is placed on: "active-window" (the foreground
# window's monitor, default) | "primary" | "index-N". For index picks,
# WinGlance records managed monitor_device_* metadata so the same monitor is
# preferred after restart even when Windows reorders display enumeration.
monitor = "active-window"
# monitor_device_id / monitor_device_index are managed by WinGlance; omit them.
# Which pill layout is used: "expanded" (default) | "compact" |
# "persistent-compact" (always-visible compact pill while media plays) |
# "auto" (compact while the foreground app is fullscreen or on the
# auto_compact_sources list, expanded otherwise).
layout = "expanded"
# Give the Compact layout its own independent position. While false, the
# Compact layout follows the Expanded position and the compact_* fields are
# retained but ignored.
compact_position_separate = false
compact_vertical = "top"
compact_horizontal = "center"
compact_margin = 8
# compact_position_x = 0
# compact_position_y = 0
compact_monitor = "active-window"
# compact_monitor_device_id / compact_monitor_device_index are managed by WinGlance.
# Hovering a pill in the Expanded layout arms its dismissal (remaining time
# capped at 500 ms). Leaving before that cap fires cancels the hover dismissal
# and restores the pre-hover deadline. For Compact-layout pills it makes the second
# hover dismiss: the first hover expands (see below), later hovers dismiss.
# Off: no hover ever dismisses a pill.
dismiss_on_hover = true
# Hovering a pill in the Compact layout expands it in place: the countdown
# resets to the full duration, the expanded state is held while the cursor
# stays on it, and leaving collapses it back to compact and resets the
# countdown again. With dismiss_on_hover on, the first hover of a showing
# expands and later hovers dismiss (the second hover dismisses); with it
# off, every hover re-expands. Off: Compact pills behave exactly like
# Expanded ones.
expand_compact_on_hover = true
# With layout = "persistent-compact", fade the pill to idle opacity after
# duration_ms of no cursor interaction. Off: the pill stays at full opacity
# while media is playing or paused (no idle fade), and hides only when the
# source has stopped (the tombstone). Hiding for fullscreen/listed
# foregrounds (hide_for_auto_compact_sources) applies either way.
fade_persistent_pill = true

[behavior]
enable_track_change = true
enable_playback_state_change = true
# Master switch for pill notifications, mirroring the tray
# "Toggle notifications" item; persisted so the toggle survives a restart.
notifications_enabled = true
debounce_ms = 200
# How long the cursor must rest on a history-table cell before its tooltip
# appears, in milliseconds (0 shows it immediately).
history_tooltip_dwell_ms = 300
# Compatibility key retained for older configs. The first-ever launch opens
# the tracking window once for setup; after that, launches are silent regardless
# of this legacy key. `false` remains parse-compatible but no longer opens later launches.
start_in_tray = true
# Create a startup registry entry so Windows launches WinGlance at logon.
start_on_login = false
# Instead of closing the app, hide the window to the tray when its X is pressed.
close_to_tray = true
# Source apps to allow (case-insensitive substrings against the
# AUMID and its label). When empty, all apps generate notifications.
# media_sources = ["spotify"]
# Preferred source for the persistent pill (same matching rules as
# media_sources, but a single app). The pill keeps showing every source's
# events; when a pill would dismiss (the idle fade) it returns to this
# source's last track instead, while the source is still playing. Unset =
# no pin. Only meaningful with layout = "persistent-compact".
# pinned_source = "spotify"
# Apps that force the Compact layout while layout = "auto" and one of them
# is the foreground app (same matching rules as media_sources). When empty,
# only fullscreen foregrounds compact.
auto_compact_sources = []
# When layout = "persistent-compact", hide the pill entirely while a
# fullscreen or listed foreground app is active — instead of showing a
# faded compact pill over games/fullscreen apps. The pill resumes when
# the foreground clears.
hide_for_auto_compact_sources = true

[appearance]
# Near-opaque dark-slate pill background (alpha 235 = ~92%): text, album art
# and symbols stay fully opaque over it, so only the body lets a hint of the
# backdrop through. Lower the alpha for more translucency; keep it at ~224
# (88%) or above so the accent-colored meta text keeps its contrast over
# bright backdrops.
background_color = [18, 20, 28, 235]
text_color = [255, 255, 255, 255]
# Accent color used across the pill: playback symbols, the music note, the
# album-art rim, and the aura fallback when the artwork yields no vibrant
# palette color.
accent_color = [240, 110, 155, 255]
corner_radius = 26.0
# Compact layout's own corner rounding (logical px), independent of
# corner_radius.
compact_corner_radius = 12.0
padding = 15.0
art_size = 48
font_size_title = 16.0
font_size_artist = 13.0
