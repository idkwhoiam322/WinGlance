# cargo-deny policy for the WinGlance build.
#
# The allowlist covers every license in the locked dependency tree. All are
# OSI-approved and FSF Free/Libre:
#   - 0BSD / MIT / Apache-2.0: adler2, serde, image, windows, ...
#   - Apache-2.0 WITH LLVM-exception: wasi (pulled in via getrandom on WASM
#     targets; unused at runtime on Windows but present in Cargo.lock)
#   - Zlib: zune-core / zune-jpeg (image's JPEG decoder)
#   - MPL-2.0: option-ext (via dirs-sys)
#   - Unicode-3.0: unicode-ident (data tables)

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
]

# Duplicate crate versions in this tree are two disjoint families that never
# exchange types, so the duplicates are benign:
#   - syn v2 (windows-implement / windows-interface) vs syn v3
#     (serde_derive): proc-macro crates, build-time only.
#   - dirs -> dirs-sys keeps windows-sys 0.48, an older windows-sys line
#     distinct from our pinned windows 0.62; the skip-tree entry excludes its
#     subtree from the duplicate check.
[bans]
skip-tree = [
    { name = "dirs-sys" },
]

# No advisories are currently ignored; the ttf-parser/fontdue RUSTSEC-2026-0192
# ignore was dropped when those crates left the dependency tree.
[advisories]
ignore = []

# Only the crates.io registry may supply dependencies: a future git or
# alternate-registry dependency must be reviewed and allow-listed explicitly
# instead of silently entering the tree.
[sources]
unknown-registry = "deny"
unknown-git = "deny"

